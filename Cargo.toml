[package]
name = "protonvpn-tui"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
authors = ["6plus <6plusjp@gmail.com>"]
description = "Terminal UI for Proton VPN - browse servers, manage connections, and configure settings"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/6plusjp/protonvpn-tui"
repository = "https://github.com/6plusjp/protonvpn-tui"
documentation = "https://docs.rs/protonvpn-tui"
keywords = ["vpn", "tui", "cli", "protonvpn", "terminal"]
categories = ["command-line-utilities", "network-programming"]

exclude = [
    "docs/",
    "AGENTS.md",
    "src/*/AGENTS.md",
    ".github/",
    ".pre-commit-config.yaml",
    "clippy.toml",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }

crossterm = { version = "0.29", features = ["use-dev-tty"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

thiserror = "1.0"
anyhow = "1.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

toml = "0.8"

chrono = { version = "0.4", features = ["serde"] }

dirs = "5.0"

once_cell = "1.19"

libc = "0.2"

[dev-dependencies]
tempfile = "3.0"
assert_cmd = "1.0"

[lints.rust]
dead_code = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
