[package]
name = "protonvpn-tui"
version = "0.1.0"
edition = "2021"
authors = ["6plus <6plusjp@gmail.com>"]
description = "Proton VPN TUI - Terminal UI for Proton VPN"
license = "MIT"
repository = "https://github.com/yourusername/protonvpn-tui"

[dependencies]
clap = { version = "=4.5", features = ["derive"] }

crossterm = "=0.27"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }

serde = { version = "=1.0", features = ["derive"] }
serde_json = "=1.0"

thiserror = "=1.0"
anyhow = "=1.0"

tracing = "=0.1"
tracing-subscriber = { version = "=0.3", features = ["env-filter"] }

toml = "=0.8"

chrono = { version = "=0.4", features = ["serde"] }

dirs = "=5.0"

once_cell = "=1.19"

[dev-dependencies]
tempfile = "=3.0"
assert_cmd = "=1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
