[package]
name = "protonvpn-tui"
version = "0.1.0"
edition = "2021"
authors = ["6plus <6plusjp@gmail.com>"]
description = "Proton VPN TUI - Terminal UI for Proton VPN"
license = "MIT"
repository = "https://github.com/yourusername/protonvpn-tui"

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# TUI
crossterm = "0.27"
ratatui = { version = "0.26", default-features = false, features = ["crossterm"] }

# Async
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "1"
anyhow = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Config
toml = "0.8"

# DateTime
chrono = { version = "0.4", features = ["serde"] }

# Paths
dirs = "5"

# Utils
once_cell = "1"
[dev-dependencies]
tempfile = "3"
assert_cmd = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
